[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-pin"
version = "0.1.1"
description = "Self-verifying hashes over supplied unique repository heads; drift named per repository"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-pin"
Source = "https://github.com/szl-holdings/szl-pin"
Issues = "https://github.com/szl-holdings/szl-pin/issues"
Changelog = "https://github.com/szl-holdings/szl-pin/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_pin"] # wheel top-level import names; the release gate fails if the built wheel differs
